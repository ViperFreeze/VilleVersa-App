# Déploiement sur Render (https://render.com), offre gratuite.
# Render lit ce fichier quand on crée un « Blueprint » à partir du dépôt GitHub.
services:
  - type: web
    name: villeversa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips : faire confiance au proxy HTTPS de Render
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      # Identifiants France Travail : Render demande leur valeur à la création
      # (sync: false = jamais écrits dans le dépôt).
      - key: FT_CLIENT_ID
        sync: false
      - key: FT_CLIENT_SECRET
        sync: false
